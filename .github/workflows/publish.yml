name: Publish to JSR

on:
  push:
    tags:
      - '[0-9]+.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Extract version and update files
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          sed -i 's/"version": "0.0.0"/"version": "'$VERSION'"/' deno.json
          cat > version.ts << EOF
          // Version injected during build by GitHub workflow
          export let VERSION = "$VERSION";
          EOF

      - name: Publish to JSR
        run: deno publish --allow-dirty
