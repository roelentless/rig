[package]
name = "rig"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
crossterm = "0.28"
sysinfo = "0.33"
thiserror = "2"
regex = "1"
chrono = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
